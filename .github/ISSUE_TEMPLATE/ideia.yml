name: Ideia
description: Sugira uma nova função, perfil ou uso para o MacroPlay
title: "[Ideia] "
labels: ["ideia"]
body:
  - type: textarea
    id: descricao
    attributes:
      label: O que o MacroPlay deveria fazer?
      description: Descreva a função e quem se beneficia dela.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Área
      options:
        - Perfis para programas
        - Jogos
        - Acessibilidade
        - Música
        - Emulador no navegador
        - Diversão
        - Produtividade
        - Educação
        - Hardware
        - Outra
    validations:
      required: true
  - type: textarea
    id: teclas
    attributes:
      label: Teclas e ações sugeridas (opcional)
